## Model/market blend weights (spec 08).
## logit(p) = w * logit(p_model) + (1 - w) * logit(p_market)
##   w = 0 -> trust the de-vigged market completely (no picks)
##   w = 1 -> raw model (claimed edges are mostly noise; see specs/07_backtest.md)
##
## NOT FITTED YET -> default 0 = market only = NO PICKS. Deliberate (2026-11-10): the raw model's
## edges are mostly noise (specs/07), so make no picks until weights are fitted on real closing lines.
## Regenerate with
##   py -m orchestration.backtest --season 2025-26 --mode fit-blend
## (needs stored closing lines), review data/backtest/blend_weights_<label>.yaml, then copy here.
fitted: false
weights:
  default: 0.0
