[project]
name = "nbaprops"
version = "0.1.0"
description = "NBA prop model — minimal bootstrap for local dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.28",
    "structlog>=24.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "selectolax>=0.3",
    "rapidfuzz>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "network: marks tests that require live network and database access",
]

[tool.black]
line-length = 100

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dashboard*", "engine*", "orchestration*", "data_pipeline*", "betting*"]
